<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d5"/>
      <stop offset="1" stop-color="#e6d8b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- paper page with rounded corner like a notebook leaf -->
  <rect x="3" y="3" width="58" height="58" rx="6" ry="6" fill="url(#paper)" stroke="#2c1810" stroke-width="2"/>

  <!-- left margin line (red ink) -->
  <line x1="14" y1="6" x2="14" y2="58" stroke="#b54a3a" stroke-width="1.6" opacity="0.85"/>

  <!-- horizontal ruled lines -->
  <line x1="18" y1="22" x2="56" y2="22" stroke="#8a6a48" stroke-width="0.8" opacity="0.35"/>
  <line x1="18" y1="44" x2="56" y2="44" stroke="#8a6a48" stroke-width="0.8" opacity="0.35"/>

  <!-- handwritten S. in ink -->
  <text x="34" y="46" text-anchor="middle"
        font-family="'Brush Script MT', 'Apple Chancery', 'Snell Roundhand', cursive"
        font-size="44" font-weight="700" font-style="italic"
        fill="#2c1810">S.</text>

  <!-- dog-ear corner top right -->
  <polygon points="61,3 61,15 49,3" fill="#cdb888" stroke="#2c1810" stroke-width="1"/>
  <line x1="49" y1="3" x2="61" y2="15" stroke="#7a5a30" stroke-width="0.7"/>
</svg>
